<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voz - Bombeiros</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #202124;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 24px 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      color: #b71c1c;
      text-align: center;
      font-size: 23px;
      margin: 0 0 8px 0;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .pergunta {
      background: #f1f1f1;
      border-radius: 10px;
      padding: 18px;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .resultado {
      margin-top: 18px;
      padding: 16px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      min-height: 62px;
      font-size: 18px;
      line-height: 1.4;
      text-align: center;
    }

    .resultado.vazio {
      color: #888;
      font-size: 15px;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      color: #666;
      font-size: 13px;
      line-height: 1.4;
      min-height: 38px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      margin-top: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .gravar {
      background: #b71c1c;
      color: white;
    }

    .confirmar {
      background: #2e7d32;
      color: white;
    }

    .repetir {
      background: #555;
      color: white;
    }

    .novo {
      background: #777;
      color: white;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .ajuda {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      background: #fff8f8;
      color: #555;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>RESPOSTA POR VOZ</h1>

    <div class="subtitulo">
      Corpo de Bombeiros Militar do Piauí
    </div>

    <div class="pergunta">
      Qual é a natureza da ocorrência?
    </div>

    <button
      id="btnGravar"
      class="gravar"
      onclick="iniciarReconhecimento()">
      🎙️ RESPONDER POR VOZ
    </button>

    <div
      id="resultado"
      class="resultado vazio">
      A resposta aparecerá aqui.
    </div>

    <div
      id="status"
      class="status">
      Aguarde a pergunta ou toque em RESPONDER POR VOZ.
    </div>

    <button
      id="btnConfirmar"
      class="confirmar"
      style="display:none;"
      onclick="confirmarResposta()">
      ✅ CONFIRMAR RESPOSTA
    </button>

    <button
      class="repetir"
      onclick="falarPergunta()">
      🔊 REPETIR PERGUNTA
    </button>

    <button
      id="btnNovo"
      class="novo"
      style="display:none;"
      onclick="gravarNovamente()">
      🔄 GRAVAR NOVAMENTE
    </button>

    <div class="ajuda">
      Fale normalmente. Depois confira o texto reconhecido.
      Se estiver correto, toque em CONFIRMAR RESPOSTA.
    </div>

  </div>


  <script>

    let reconhecimento = null;
    let respostaReconhecida = "";


    function falarPergunta() {

      if (!("speechSynthesis" in window)) {

        atualizarStatus(
          "Seu navegador não possui suporte à síntese de voz."
        );

        return;
      }

      window.speechSynthesis.cancel();

      const fala =
        new SpeechSynthesisUtterance(
          "Qual é a natureza da ocorrência?"
        );

      fala.lang = "pt-BR";
      fala.rate = 0.95;
      fala.pitch = 1;

      fala.onstart = function() {
        atualizarStatus(
          "🔊 Pergunta sendo falada..."
        );
      };

      fala.onend = function() {
        atualizarStatus(
          "Agora toque em RESPONDER POR VOZ e fale sua resposta."
        );
      };

      window.speechSynthesis.speak(fala);

    }


    function iniciarReconhecimento() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        atualizarStatus(
          "O Google Chrome é recomendado para o reconhecimento de voz."
        );

        return;

      }


      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }


      if (
        reconhecimento &&
        typeof reconhecimento.abort === "function"
      ) {

        try {
          reconhecimento.abort();
        } catch (erro) {}

      }


      respostaReconhecida = "";

      const resultado =
        document.getElementById("resultado");

      if (resultado) {

        resultado.textContent =
          "Ouvindo...";

        resultado.classList.remove("vazio");

      }


      document.getElementById(
        "btnGravar"
      ).disabled = true;

      document.getElementById(
        "btnConfirmar"
      ).style.display = "none";

      document.getElementById(
        "btnNovo"
      ).style.display = "none";


      atualizarStatus(
        "🎙️ Estou ouvindo... fale agora."
      );


      reconhecimento =
        new SpeechRecognition();


      reconhecimento.lang = "pt-BR";
      reconhecimento.continuous = false;
      reconhecimento.interimResults = true;
      reconhecimento.maxAlternatives = 1;


      reconhecimento.onresult =
        function(event) {

          let textoFinal = "";
          let textoIntermediario = "";


          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            const resultadoAtual =
              event.results[i];


            if (
              resultadoAtual.isFinal
            ) {

              textoFinal +=
                resultadoAtual[0].transcript;

            } else {

              textoIntermediario +=
                resultadoAtual[0].transcript;

            }

          }


          const texto =
            (
              textoFinal ||
              textoIntermediario
            ).trim();


          if (!texto) {
            return;
          }


          const areaResultado =
            document.getElementById(
              "resultado"
            );


          if (areaResultado) {

            areaResultado.textContent =
              texto;

            areaResultado.classList.remove(
              "vazio"
            );

          }


          if (textoFinal.trim()) {

            respostaReconhecida =
              textoFinal.trim();

            atualizarStatus(
              "Confira a resposta. Se estiver correta, confirme; se precisar, grave novamente."
            );

            document.getElementById(
              "btnConfirmar"
            ).style.display = "block";

            document.getElementById(
              "btnNovo"
            ).style.display = "block";

          }

        };


      reconhecimento.onerror =
        function(event) {

          let mensagem =
            "Não foi possível reconhecer a resposta.";


          if (
            event.error === "not-allowed"
          ) {

            mensagem =
              "Permissão do microfone não autorizada. Permita o microfone para este site.";

          }

          else if (
            event.error === "no-speech"
          ) {

            mensagem =
              "Nenhuma fala foi detectada. Toque novamente e fale após o início da gravação.";

          }

          else if (
            event.error === "audio-capture"
          ) {

            mensagem =
              "Não foi possível acessar o microfone deste dispositivo.";

          }


          atualizarStatus(mensagem);

        };


      reconhecimento.onend =
        function() {

          document.getElementById(
            "btnGravar"
          ).disabled = false;


          if (!respostaReconhecida) {

            atualizarStatus(
              "Gravação encerrada. Se necessário, tente novamente."
            );

          }

        };


      try {

        reconhecimento.start();

      }

      catch (erro) {

        document.getElementById(
          "btnGravar"
        ).disabled = false;

        atualizarStatus(
          "Não foi possível iniciar o reconhecimento. Tente novamente."
        );

      }

    }


    function gravarNovamente() {

      respostaReconhecida = "";

      const resultado =
        document.getElementById(
          "resultado"
        );

      if (resultado) {

        resultado.textContent =
          "A resposta aparecerá aqui.";

        resultado.classList.add(
          "vazio"
        );

      }

      document.getElementById(
        "btnConfirmar"
      ).style.display = "none";

      document.getElementById(
        "btnNovo"
      ).style.display = "none";

      iniciarReconhecimento();

    }


    function confirmarResposta() {

      const texto =
        String(
          respostaReconhecida || ""
        ).trim();


      if (!texto) {

        atualizarStatus(
          "Não há uma resposta reconhecida para confirmar."
        );

        return;

      }


      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            tipo: "resultadoVozNatureza",
            texto: texto
          },
          "*"
        );

        atualizarStatus(
          "Resposta enviada ao sistema principal."
        );


        setTimeout(function() {

          window.close();

        }, 500);

        return;

      }


      atualizarStatus(
        "A janela principal do sistema não foi encontrada. Feche esta janela e tente novamente."
      );

    }


    function atualizarStatus(texto) {

      const status =
        document.getElementById(
          "status"
        );

      if (status) {
        status.textContent = texto;
      }

    }


    window.addEventListener(
      "load",
      function() {

        setTimeout(
          falarPergunta,
          400
        );

      }
    );

  </script>

</body>
</html>
