<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voz - Corpo de Bombeiros</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f2f4f7;
      font-family: Arial, sans-serif;
      color: #202124;
    }
    .card {
      max-width: 460px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      color: #b71c1c;
      font-size: 22px;
    }
    .pergunta {
      margin: 18px 0;
      font-size: 18px;
      line-height: 1.45;
      font-weight: 700;
      text-align: center;
    }
    .status {
      min-height: 44px;
      margin: 12px 0;
      padding: 10px;
      border-radius: 9px;
      background: #f7f7f7;
      color: #555;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
    }
    textarea {
      width: 100%;
      min-height: 130px;
      padding: 12px;
      border: 1px solid #c9cdd2;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: #b71c1c;
      box-shadow: 0 0 0 2px rgba(183,28,28,.10);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 9px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .gravar { background: #b71c1c; color: #fff; }
    .confirmar { background: #2e7d32; color: #fff; }
    .repetir { background: #555; color: #fff; }
    .novamente { background: #777; color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>

<div class="card">
  <h1>REGISTRO DE OCORRÊNCIA</h1>
  <div id="pergunta" class="pergunta"></div>

  <div id="status" class="status">
    Preparando a pergunta...
  </div>

  <textarea id="texto"
    placeholder="A resposta reconhecida aparecerá aqui. Você também pode editar antes de confirmar."></textarea>

  <button id="btnGravar" class="gravar" onclick="gravar()">
    🎙️ RESPONDER POR VOZ
  </button>

  <button class="confirmar" onclick="confirmar()">
    ✓ CONFIRMAR RESPOSTA
  </button>

  <button class="repetir" onclick="falarPergunta()">
    🔊 REPETIR PERGUNTA
  </button>

  <button class="novamente" onclick="gravar()">
    🔄 GRAVAR NOVAMENTE
  </button>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const campo = params.get("campo") || "situacao";

  const perguntas = {
    situacao: {
      pergunta: "Descreva a situação encontrada pela guarnição."
    },
    vitimas: {
      pergunta: "Informe as vítimas da ocorrência."
    },
    procedimentos: {
      pergunta: "Descreva os procedimentos realizados pela guarnição."
    },
    equipamentos: {
      pergunta: "Informe os equipamentos utilizados na ocorrência."
    },
    apoio: {
      pergunta: "Informe o apoio recebido durante a ocorrência. Se não houve, diga: Não houve."
    },
    encaminhamento: {
      pergunta: "Informe o encaminhamento realizado."
    },
    situacaoFinal: {
      pergunta: "Descreva a situação final da ocorrência."
    },
    observacoes: {
      pergunta: "Informe as observações da ocorrência. Se não houver, diga: Não há observações."
    }
  };

  const configuracao =
    perguntas[campo] || perguntas.situacao;

  const pergunta = document.getElementById("pergunta");
  const status = document.getElementById("status");
  const texto = document.getElementById("texto");
  const btnGravar = document.getElementById("btnGravar");

  pergunta.textContent = configuracao.pergunta;

  let reconhecimento = null;
  let reconhecimentoAtivo = false;

  function falarPergunta(callback) {
    if (!("speechSynthesis" in window)) {
      status.textContent =
        "Seu navegador não oferece reprodução de voz.";
      if (callback) callback();
      return;
    }

    window.speechSynthesis.cancel();

    const fala =
      new SpeechSynthesisUtterance(
        configuracao.pergunta
      );

    fala.lang = "pt-BR";
    fala.rate = 0.95;
    fala.pitch = 1;

    fala.onstart = function() {
      status.textContent = "Pergunta sendo falada...";
    };

    fala.onend = function() {
      status.textContent =
        "Pode falar agora...";
      if (callback) callback();
    };

    fala.onerror = function() {
      status.textContent =
        "Não foi possível reproduzir a pergunta. Você pode responder mesmo assim.";
      if (callback) callback();
    };

    window.speechSynthesis.speak(fala);
  }

  function iniciarReconhecimento() {
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      status.textContent =
        "O reconhecimento de voz não é compatível com este navegador.";
      return;
    }

    if (reconhecimentoAtivo) {
      return;
    }

    reconhecimento =
      new SpeechRecognition();

    reconhecimento.lang = "pt-BR";
    reconhecimento.continuous = false;
    reconhecimento.interimResults = true;
    reconhecimento.maxAlternatives = 1;

    reconhecimentoAtivo = true;
    btnGravar.disabled = true;
    btnGravar.textContent = "🎙️ OUVINDO...";
    status.textContent = "Pode falar agora...";

    reconhecimento.onresult = function(event) {
      let textoFinal = "";
      let textoIntermediario = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {
        const resultado = event.results[i];

        if (resultado.isFinal) {
          textoFinal += resultado[0].transcript;
        } else {
          textoIntermediario += resultado[0].transcript;
        }
      }

      const resultadoTexto =
        (textoFinal || textoIntermediario).trim();

      if (resultadoTexto) {
        texto.value = resultadoTexto;
      }

      if (textoFinal.trim()) {
        status.textContent =
          "Resposta reconhecida. Confira o texto antes de confirmar.";
      }
    };

    reconhecimento.onerror = function(event) {
      let mensagem =
        "Não foi possível reconhecer a resposta.";

      if (event.error === "not-allowed") {
        mensagem =
          "O acesso ao microfone foi negado. Autorize o microfone no navegador.";
      } else if (event.error === "no-speech") {
        mensagem =
          "Nenhuma fala foi detectada. Tente novamente.";
      } else if (event.error === "audio-capture") {
        mensagem =
          "Não foi possível acessar o microfone deste dispositivo.";
      }

      status.textContent = mensagem;
    };

    reconhecimento.onend = function() {
      reconhecimentoAtivo = false;
      btnGravar.disabled = false;
      btnGravar.textContent =
        "🎙️ RESPONDER POR VOZ";
    };

    try {
      reconhecimento.start();
    } catch (erro) {
      reconhecimentoAtivo = false;
      btnGravar.disabled = false;
      btnGravar.textContent =
        "🎙️ RESPONDER POR VOZ";
      status.textContent =
        "Não foi possível iniciar o reconhecimento. Tente novamente.";
    }
  }

  function gravar() {
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }

    /* A fala começa após o clique do usuário.
       Isso evita depender do autoplay do Chrome. */
    falarPergunta(function() {
      iniciarReconhecimento();
    });
  }

  function confirmar() {
    const resposta =
      texto.value.trim();

    if (!resposta) {
      status.textContent =
        "Informe ou grave uma resposta antes de confirmar.";
      texto.focus();
      return;
    }

    if (
      !window.opener ||
      window.opener.closed
    ) {
      status.textContent =
        "A janela principal do sistema não está disponível.";
      return;
    }

    window.opener.postMessage(
      {
        tipo: "resultadoVozBloco4",
        campo: campo,
        texto: resposta
      },
      "*"
    );

    status.textContent =
      "Resposta enviada ao sistema. Esta janela será fechada.";

    setTimeout(function() {
      window.close();
    }, 400);
  }
</script>

</body>
</html>
